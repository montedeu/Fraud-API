name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # redeploys main without a commit

permissions:
  contents: read

concurrency:
  # One deploy at a time. A running deploy is never cancelled; a newer push replaces
  # one still waiting, so the latest commit is what ends up live.
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    # The dispatch button offers every branch; only main may go live.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # the GitHub OIDC token that Workload Identity Federation exchanges
    env:
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      CLOUDSDK_RUN_REGION: ${{ vars.GCP_REGION }}
      SERVICE: fraud-api
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/fraud-api:${{ github.sha }}
    # Actions pinned to commits: this job holds a token that can deploy.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Short-lived credentials for the deployer service account; no JSON key exists.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Log Docker in to Artifact Registry
        run: gcloud auth configure-docker "$CLOUDSDK_RUN_REGION-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The only image build on main; it also refreshes the layer cache PRs read.
      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          # One manifest per deploy, no attestation alongside it, so the registry's cleanup
          # policy (scripts/provision.sh) counts deploys exactly.
          provenance: false
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      # The new revision gets the "candidate" tag and no traffic, so callers stay on the
      # current revision until the smoke test has passed on the new one. The database URL
      # is a Secret Manager reference; its value never passes through this workflow.
      # --no-cpu-throttling: the Prediction Log is written by a thread after the response
      # is sent, and a throttled CPU between requests would leave its rows queued.
      - name: Deploy a candidate revision
        id: deploy
        run: |
          traffic=()
          if gcloud run services describe "$SERVICE" >/dev/null 2>&1; then
            traffic=(--no-traffic) # refused when the service is created
            # What serves now, recorded before anything changes: the promotion tags it
            # "previous", and a failed or cancelled deploy goes back to it.
            serving=$(gcloud run services describe "$SERVICE" --format=json | jq -r \
              '[.status.traffic[] | select(.percent > 0)] | max_by(.percent) | .revisionName // empty')
            echo "serving=$serving" >> "$GITHUB_OUTPUT"
          fi
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SA" \
            --allow-unauthenticated \
            --max-instances 1 --cpu 1 --memory 512Mi \
            --no-cpu-throttling \
            --set-secrets DATABASE_URL=database-url:latest \
            --tag candidate "${traffic[@]}" \
            --quiet

      - name: Smoke-test the candidate revision
        run: |
          url=$(gcloud run services describe "$SERVICE" --format=json \
            | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')
          echo "candidate: $url"
          python3 scripts/smoke_test.py "$url"

      - name: Send all traffic to the tested revision
        env:
          SERVING: ${{ steps.deploy.outputs.serving }}
        run: |
          tags=()
          [[ -n "$SERVING" ]] && tags=(--update-tags "previous=$SERVING") # the rollback target
          gcloud run services update-traffic "$SERVICE" --to-tags candidate=100 "${tags[@]}" --quiet
          url=$(gcloud run services describe "$SERVICE" --format='value(status.url)')
          python3 scripts/smoke_test.py "$url"
          echo "### Live at $url ($(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"

      # A failed or cancelled deploy goes back to what served before: traffic, and the
      # candidate tag, so "candidate" always names the last revision that passed. The
      # failed revision stays, untagged and without traffic (Cloud Run won't delete the
      # newest revision of a service).
      - name: Undo a failed deploy
        if: (failure() || cancelled()) && steps.deploy.outputs.serving != ''
        env:
          SERVING: ${{ steps.deploy.outputs.serving }}
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --to-revisions "$SERVING=100" --update-tags "candidate=$SERVING" --quiet
          echo "### Deploy failed: still serving $SERVING" >> "$GITHUB_STEP_SUMMARY"
