[project]
name = "fraud-api"
version = "0.1.0"
description = "Scores bank account Applications for fraud risk."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.8",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
fraud-api = "fraud_api.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    # Embedded Postgres for the Prediction Log tests when TEST_DATABASE_URL is unset;
    # its wheels cover x86-64 Linux, macOS and Windows only.
    "pgserver>=0.1.4; (sys_platform != 'linux' or platform_machine == 'x86_64') and (sys_platform != 'win32' or platform_machine == 'AMD64')",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
# Only for `fraud-api download`: uv run --group kaggle fraud-api download
kaggle = [
    "kaggle>=2.2.5",
    # kaggle 2.2.5 imports six without declaring it.
    "six>=1.17.0",
]
notebook = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
]
