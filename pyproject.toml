[project]
name = "fraud-api"
version = "0.1.0"
description = "Scores bank account Applications for fraud risk."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
